[project]
name = "memory-wiki"
version = "0.2.0"
description = "Hermes memory provider with review-first wiki capture, claim compilation, and phased dreaming"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
